<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f5f2eb">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Page not found — Tommy Julio</title>
  <style>
    .not-found { min-height: 75vh; padding: 12vh var(--gutter); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .not-found h1 { margin: 0; font: 400 clamp(64px, 12vw, 140px)/1 var(--serif); letter-spacing: -4px; }
    .not-found p { max-width: 440px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/" aria-label="Tommy Julio — Home">TJ<span>.</span></a>
  </header>
  <main class="not-found">
    <p class="eyebrow">ERROR 404</p>
    <h1>Page not found<span>.</span></h1>
    <p>The page you’re looking for doesn’t exist or may have moved.</p>
    <a class="text-link" href="/">Back to homepage <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
